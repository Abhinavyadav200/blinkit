<!DOCTYPE html>
<html>
<head>
    <title>Blinkit Clone</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="navbar">

        <div class="logo">
            blink<span>it</span>
        </div>

        <div class="location">
            <h3>Delivery in 17 minutes</h3>
            <p>Meerut, Uttar Pradesh ▼</p>
        </div>

        <div class="search">
            <span>🔍</span>
            <input type="text" placeholder='Search "milk"'>
        </div>

        <button class="login">Login</button>

        <button class="cart">🛒 My Cart</button>

    </div>
    
<div class="banner">

    <div class="banner-text">
        <h1>Stock up on daily essentials</h1>

        <p>
            Get farm-fresh goodness and a range of
            fruits, vegetables, eggs and more.
        </p>

        <button>Shop Now</button>
    </div>

    <div class="banner-image">
        <img src="assets/banner.jpg" alt="Daily essentials">
    </div>

</div>


</body>
</html>
